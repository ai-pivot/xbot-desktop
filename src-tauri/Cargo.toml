[package]
name = "xbot-desktop"
version = "0.1.25"
description = "xbot desktop client"
authors = ["xbot"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "xbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
futures-util = "0.3"
url = "2"
rfd = "0.15"
open = "5"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
base64 = "0.22"
semver = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
